[project]
name = "uiprobe"
version = "0.1.0"
description = "Screenshot-driven single-case browser testing agent"
requires-python = ">=3.11"
dependencies = [
    "langfuse>=5.2.0",
    "openai>=3.50.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "playwright>=1.65.1",
    "pydantic>=2.14.3",
    "pydantic-ai-slim[openai]>=2.68.0",
    "python-dotenv>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uiprobe"]
