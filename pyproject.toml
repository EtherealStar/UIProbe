[project]
name = "uiprobe"
version = "0.1.0"
description = "Screenshot-driven single-case browser testing agent"
requires-python = ">=3.11"
dependencies = [
    "langfuse>=5.2.0",
    "openai>=3.50.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "playwright>=1.65.1",
    "pydantic>=2.14.3",
    "pydantic-ai-slim[openai]>=2.68.0",
    "python-dotenv>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uiprobe"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py311"
extend-exclude = [".scratch"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"
